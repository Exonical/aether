name: Self-hosted runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --prefix runtime
      - run: npm test --prefix runtime
      - run: npm test --prefix runtime/models
      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/aether.yaml
          kubectl kustomize deploy/kubernetes/overlays/kata > /tmp/aether-kata.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-s3 > /tmp/aether-s3.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-gateway > /tmp/aether-gateway.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-postgres > /tmp/aether-postgres.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-postgres-gateway > /tmp/aether-postgres-gateway.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-models > /tmp/aether-models.yaml
          kubectl kustomize deploy/kubernetes/overlays/workspace-oidc > /tmp/aether-oidc.yaml
      - name: Build runtime image
        run: docker build -f runtime/Dockerfile -t aether-runtime:ci runtime
      - name: Verify container startup and read-only filesystem
        run: |
          docker run -d --name aether --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp -p 127.0.0.1:8080:8080 -v aether-state:/var/lib/aether aether-runtime:ci
          trap 'docker logs aether; docker rm -f aether' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/readyz
          curl --fail -X POST http://127.0.0.1:8080/internal/probes/worker
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.28.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: node --test 'scripts/**/*.test.ts'
      - run: pnpm run types:scripts
      - run: pnpm --filter custom-gatekeeper test:run
      - run: pnpm --filter error-reporter test:run
  workspace:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aether_test
          POSTGRES_PASSWORD: aether-test-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aether_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm install --global pnpm@11.28.5
      - run: npm ci --prefix runtime
      - run: npm ci --prefix runtime/postgres --ignore-scripts
      - name: Verify native KV contracts and PostgreSQL role isolation
        run: npm test --prefix runtime/postgres
        env:
          AETHER_TEST_PGHOST: 127.0.0.1
      - run: pnpm --dir cloudflare-os install --frozen-lockfile --pm-on-fail=ignore
      - name: Build the previous main artifact for storage upgrade verification
        run: |
          mkdir -p /tmp/aether-baseline
          baseline_sha="$BASE_SHA"
          if ! git cat-file -e "$baseline_sha^{commit}" 2>/dev/null; then baseline_sha=origin/main; fi
          git archive "$baseline_sha" runtime | tar -x -C /tmp/aether-baseline
          ln -s "$GITHUB_WORKSPACE/cloudflare-os" /tmp/aether-baseline/cloudflare-os
          npm ci --prefix /tmp/aether-baseline/runtime
          node /tmp/aether-baseline/runtime/build-workspace.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AETHER_BUILD_DIR: /tmp/aether-previous-workspace
          AETHER_TENANT_ID: acme
          AETHER_MODEL_GATEWAY: 'true'
          pnpm_config_pm_on_fail: ignore
      - run: npm run workspace:build --prefix runtime
        env:
          AETHER_TENANT_ID: acme
          AETHER_MODEL_GATEWAY: 'true'
      - name: Verify pinned model SDK with scoped native transport
        run: npm test --prefix runtime/models
        env:
          AETHER_TEST_MODEL_SDK: 'true'
      - name: Verify workspace state across the dependency upgrade
        run: npm run workspace:test --prefix runtime
        env:
          AETHER_TEST_PREVIOUS_BUILD_DIR: /tmp/aether-previous-workspace
      - name: Verify full workspace with PostgreSQL KV
        run: npm run workspace:test --prefix runtime
        env:
          AETHER_TENANT_ID: acme
          AETHER_KV_STORAGE: postgres
          PGHOST: 127.0.0.1
          PGDATABASE: aether_test
          PGUSER: aether_acme
          PGPASSWORD: aether-test-secret
          AETHER_PG_SSL_MODE: disable
          AETHER_PG_ALLOW_PLAINTEXT: 'true'
      - name: Render workspace Kubernetes overlay
        run: kubectl kustomize deploy/kubernetes/overlays/workspace > /tmp/aether-workspace.yaml
      - name: Build standalone workspace image
        run: docker build -f runtime/Dockerfile.workspace -t aether-workspace:ci runtime
      - name: Verify native workspace container
        run: |
          docker run -d --name workspace --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp -p 127.0.0.1:8080:8080 -v aether-workspace-state:/var/lib/aether aether-workspace:ci
          trap 'docker logs workspace; docker rm -f workspace' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/admin
      - name: Build PostgreSQL adapter image
        run: docker build -f runtime/postgres/Dockerfile -t aether-postgres:ci runtime/postgres
      - name: Verify read-only PostgreSQL adapter container
        run: |
          docker run -d --name postgres-adapter --network host --read-only --cap-drop=ALL --security-opt=no-new-privileges -e PGHOST=127.0.0.1 -e PGDATABASE=aether_test -e PGUSER=aether_acme -e PGPASSWORD=aether-test-secret -e AETHER_TENANT_ID=acme -e AETHER_PG_SSL_MODE=disable -e AETHER_PG_ALLOW_PLAINTEXT=true aether-postgres:ci
          trap 'docker logs postgres-adapter; docker rm -f postgres-adapter' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:9002/readyz
      - name: Build model adapter image
        run: docker build -f runtime/models/Dockerfile -t aether-models:ci runtime/models
      - name: Verify read-only model adapter container
        run: |
          docker run -d --name model-adapter --read-only --cap-drop=ALL --security-opt=no-new-privileges -e AETHER_TENANT_ID=acme -e AETHER_MODEL_ENDPOINT=https://models.invalid/v1 -e 'AETHER_MODEL_ALLOWLIST=["fixture"]' aether-models:ci
          trap 'docker logs model-adapter; docker rm -f model-adapter' EXIT
          for attempt in $(seq 1 20); do
            if docker exec model-adapter node -e "fetch('http://127.0.0.1:9003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci --prefix runtime/oidc --ignore-scripts
      - name: Build OIDC tenant artifact
        run: npm run workspace:build --prefix runtime
        env:
          AETHER_TENANT_ID: acme
          AETHER_MODEL_GATEWAY: 'true'
          AETHER_OIDC: 'true'
          AETHER_BUILD_DIR: /tmp/aether-oidc-workspace
      - name: Verify signed OIDC protocol and full native workspace
        run: npm test --prefix runtime/oidc
        env:
          AETHER_TEST_OIDC_WORKSPACE: 'true'
          AETHER_BUILD_DIR: /tmp/aether-oidc-workspace
      - name: Start Keycloak with a synthetic tenant realm
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8180:8080 -e KC_HOSTNAME=http://127.0.0.1:8180 -v "$PWD/runtime/oidc/test/keycloak-realm.json:/opt/keycloak/data/import/aether.json:ro" quay.io/keycloak/keycloak:26.7.5 start-dev --import-realm
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8180/realms/aether/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs keycloak
          exit 1
      - name: Verify native workspace sign-in against real Keycloak browser flow
        run: node --test runtime/oidc/test/workspace.test.mjs
        env:
          AETHER_TEST_OIDC_WORKSPACE: 'true'
          AETHER_TEST_KEYCLOAK_ISSUER: http://127.0.0.1:8180/realms/aether
          AETHER_BUILD_DIR: /tmp/aether-oidc-workspace
      - name: Build OIDC adapter image
        run: docker build -f runtime/oidc/Dockerfile -t aether-oidc:ci runtime/oidc
      - name: Verify read-only OIDC adapter container
        run: |
          docker run -d --name oidc-adapter --network host --read-only --cap-drop=ALL --security-opt=no-new-privileges -e AETHER_TENANT_ID=acme -e AETHER_PUBLIC_URL=http://127.0.0.1:8080 -e AETHER_OIDC_ISSUER=http://127.0.0.1:8180/realms/aether -e AETHER_OIDC_CLIENT_ID=aether -e AETHER_OIDC_CLIENT_SECRET=fixture-secret -e AETHER_OIDC_ALLOW_HTTP=true aether-oidc:ci
          trap 'docker logs oidc-adapter; docker rm -f oidc-adapter' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:9004/readyz
      - name: Keycloak logs
        if: always()
        run: docker logs keycloak || true
  s3:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [minio, seaweedfs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix runtime
      - run: npm ci --prefix runtime/s3 --ignore-scripts
      - uses: actions/setup-go@v5
        if: matrix.provider == 'minio'
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build and start pinned MinIO test backend
        if: matrix.provider == 'minio'
        run: |
          go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
          MINIO_ROOT_USER=aether-test MINIO_ROOT_PASSWORD=aether-test-secret MINIO_UPDATE=off "$(go env GOPATH)/bin/minio" server /tmp/minio-data --address 127.0.0.1:8333 --console-address 127.0.0.1:8334 > /tmp/minio.log 2>&1 &
      - name: Start SeaweedFS test backend
        if: matrix.provider == 'seaweedfs'
        run: |
          cat > /tmp/s3.json <<'EOF'
          {"identities":[{"name":"aether-tests","credentials":[{"accessKey":"aether-test","secretKey":"aether-test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          docker run -d --name s3 -p 127.0.0.1:8333:8333 -v /tmp/s3.json:/etc/seaweedfs/s3.json:ro chrislusf/seaweedfs:4.48 server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -volume.max=5
      - name: Wait for S3 endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:8333/; then exit 0; fi
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Verify native R2 against S3
        run: npm test --prefix runtime/s3
        env:
          AETHER_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      - name: Build adapter image
        run: docker build -f runtime/s3/Dockerfile -t aether-s3:ci runtime/s3
      - name: Verify read-only adapter container
        run: |
          docker run -d --name adapter --read-only --cap-drop=ALL --security-opt=no-new-privileges -e AWS_ENDPOINT_URL=http://s3.invalid -e AWS_DEFAULT_REGION=us-east-1 -e BUCKET_NAME=test-bucket -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test -e AETHER_TENANT_ID=test -e AETHER_S3_ALLOW_HTTP=true aether-s3:ci
          for attempt in $(seq 1 20); do
            if docker exec adapter node -e "fetch('http://127.0.0.1:9001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Container logs
        if: always()
        run: |
          docker logs s3 || true
          docker logs adapter || true
          cat /tmp/minio.log 2>/dev/null || true
