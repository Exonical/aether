{{- if .Values.execution.enabled }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "Agent execution requires networkPolicy.enabled=true" }}
{{- end }}
{{- if .Values.execution.egress }}
{{- fail "Agent execution.egress must be empty: external writes must pass through Gatekeeper" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aether.name" . }}-execution-git
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector: {{- include "aether.selector" . | nindent 4 }}
  ports: [{name: git, port: 9007, targetPort: git-broker}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether.name" . }}-execution
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aether.name" . }}-execution
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, create, patch, delete]
  - apiGroups: ['']
    resources: [pods/proxy]
    verbs: [create]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, patch{{ if gt (int .Values.execution.retentionSeconds) 0 }}, delete{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aether.name" . }}-execution
  namespace: {{ .Release.Namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aether.name" . }}-execution
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aether.name" . }}-execution
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "aether.name" . }}-execution-workspaces
  namespace: {{ .Release.Namespace | quote }}
spec:
  endpointSelector:
    matchLabels:
      aether.dev/execution: {{ .Values.tenantId | quote }}
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '9006', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {{- include "aether.selector" . | nindent 12 }}
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
      toPorts:
        - ports: [{port: '9007', protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]
          rules:
            dns:
              - matchName: {{ printf "%s-execution-git.%s.svc.%s" (include "aether.name" .) .Release.Namespace .Values.networkPolicy.clusterDomain | quote }}

{{- end }}
