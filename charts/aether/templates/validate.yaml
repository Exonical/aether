{{- if not .Values.tenants }}{{ fail "tenants must contain at least one tenant" }}{{ end -}}
{{- $ids := dict -}}
{{- $namespaces := dict -}}
{{- $names := dict -}}
{{- range .Values.tenants -}}
{{- if hasKey $ids .tenantId }}{{ fail "duplicate tenantId" }}{{ end -}}
{{- $_ := set $ids .tenantId true -}}
{{- if hasKey $namespaces .namespace }}{{ fail "each tenant requires a unique dedicated namespace" }}{{ end -}}
{{- if has .namespace (list "default" "kube-system" "kube-public" "kube-node-lease" $.Release.Namespace) }}{{ fail "tenant namespaces must be dedicated and separate from the Helm release namespace" }}{{ end -}}
{{- $_ := set $namespaces .namespace true -}}
{{- $name := default (printf "%s-%s-aether" $.Release.Name .tenantId) (default $.Values.fullnameOverride .fullnameOverride) | trunc 54 | trimSuffix "-" -}}
{{- if hasKey $names $name }}{{ fail "tenant resource names collide; set distinct fullnameOverride values" }}{{ end -}}
{{- $_ := set $names $name true -}}
{{- end -}}
{{- define "aether.validate" -}}
{{- $_ := required "tenantId must match the tenant-specific workspace image" .Values.tenantId -}}
{{- range $key := list "s3" "postgres" "models" "oidc" -}}
{{- $adapter := index $.Values $key -}}
{{- if $adapter.enabled -}}
{{- $_ := required (printf "%s.existingSecret is required" $key) $adapter.existingSecret -}}
{{- if and $.Values.networkPolicy.enabled (not (or $adapter.egress $.Values.networkPolicy.extraEgress)) -}}
{{- fail (printf "%s.egress or networkPolicy.extraEgress must allow the configured backend" $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.gateway.enabled -}}
{{- $_ := required "gateway.hostname is required" .Values.gateway.hostname -}}
{{- if .Values.gateway.create -}}
{{- $_ := required "gateway.tlsSecretName is required" .Values.gateway.tlsSecretName -}}
{{- else if not .Values.gateway.parentRefs -}}
{{- fail "gateway.parentRefs is required when gateway.create=false" -}}
{{- end -}}
{{- end -}}
{{- if .Values.oidc.enabled -}}
{{- $_ := required "oidc.publicUrl is required" .Values.oidc.publicUrl -}}
{{- if and .Values.gateway.enabled (ne .Values.oidc.publicUrl (printf "https://%s" .Values.gateway.hostname)) -}}
{{- fail "oidc.publicUrl must match the HTTPS gateway.hostname origin" -}}
{{- end -}}
{{- end -}}

{{- end -}}

{{- range $tenant := .Values.tenants }}
{{- $values := mergeOverwrite (deepCopy $.Values) (deepCopy $tenant) }}
{{- $release := mergeOverwrite (deepCopy $.Release) (dict "Name" (printf "%s-%s" $.Release.Name $tenant.tenantId) "Namespace" $tenant.namespace) }}
{{- $ctx := dict "Values" $values "Release" $release "Chart" $.Chart "Capabilities" $.Capabilities }}
{{- include "aether.validate" $ctx }}
{{- end }}
