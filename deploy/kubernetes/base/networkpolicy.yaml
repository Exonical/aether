apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aether-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aether-runtime
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
