apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aether
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      hostname: acme.aether.example
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: aether-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aether
spec:
  parentRefs:
    - name: aether
      sectionName: https
  hostnames:
    - acme.aether.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aether
          port: 8080
