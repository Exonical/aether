apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aether-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aether-runtime
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
