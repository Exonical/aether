apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aether-acme
resources:
  - ../workspace-s3
  - gateway.yaml
  - gateway-policy.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: aether-runtime
    patch: |-
      - op: replace
        path: /spec/ingress
        value: []
