apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aether-model-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aether-runtime
  egress:
    # Replace with the user's exact model gateway hostname and port.
    # For an in-cluster gateway, use toEndpoints selectors instead (see docs).
    - toFQDNs:
        - matchName: models.inference.example
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
