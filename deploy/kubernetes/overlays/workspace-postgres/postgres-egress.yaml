apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aether-postgres-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aether-runtime
  egress:
    # Replace with the user's exact database hostname and port.
    # For an in-cluster database, use a toEndpoints selector instead (see docs).
    - toFQDNs:
        - matchName: postgres.storage.example
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
