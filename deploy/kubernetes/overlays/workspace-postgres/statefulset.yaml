apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aether
spec:
  template:
    spec:
      containers:
        - name: workerd
          args:
            - serve
            - /opt/aether/workspace-postgres-s3.capnp.bin
            - --binary
            - --experimental
            - --socket-addr=http=0.0.0.0:8080
            - --directory-path=aether:assets-disk=/opt/aether/assets
            - --directory-path=aether:do-storage=/var/lib/aether/do
            - --directory-path=kv:storage=/var/lib/aether/kv
            - --directory-path=r2:storage=/var/lib/aether/r2
        - name: postgres-adapter
          image: registry.example.com/aether/postgres-kv:0.1.0
          env:
            - name: AETHER_TENANT_ID
              value: acme
          envFrom:
            - secretRef:
                name: aether-postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:9002/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:9002/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:9002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
