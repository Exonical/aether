apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aether-s3-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aether-runtime
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Replace with the exact endpoint hostname and port supplied by the user.
    # In-cluster S3 needs a toEndpoints selector instead of toFQDNs (see docs).
    - toFQDNs:
        - matchName: s3.storage.example
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
