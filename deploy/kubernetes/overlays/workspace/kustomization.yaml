apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: aether
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AETHER_ADMINS
            value: '["admin"]'
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
images:
  - name: registry.example.com/aether/runtime
    newName: registry.example.com/aether/workspace
    newTag: "0.2.0"
