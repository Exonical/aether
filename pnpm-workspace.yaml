# Shared package catalog mirrors the pinned Cloudflare OS revision.
# Keep Vite 7 and Vitest 4 for Workers tests, with separate VitePlus/Vitest 5 peers.
# VitePlus names its bundled Vite API package by the CLI version (1.1.0).
packages:
- cloudflare-os/packages/workshop-shared
- cloudflare-os/packages/error-reporting
- packages/*
- cloudflare-os/scripts
catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20261001.1
  capnweb: ^0.12.0
  diff: ^8.0.4
  capnweb-validate: 0.3.0
  miniflare: 5.20261001.0-alpha
  typescript: 7.0.2
  typescript6: npm:typescript@6.0.3
  vite: 7.3.6
  vite-plus: ^1.0.0
  vitest: ^4.1.11
  wrangler: ^4.147.0
  zod: ^4.6.5
overrides:
  '@types/node': 26.1.0
  vite@*: 'catalog:'
  '@cloudflare/vitest-pool-workers>miniflare': 'catalog:'
  '@cloudflare/vitest-pool-workers>wrangler': 'catalog:'
  vitest@4>@vitest/browser-preview: 4.1.11
  vitest@4>vite: 7.3.6
allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    vitest@5>vite: 1.1.0
    '@vitest/mocker@5>vite': 1.1.0
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false
packageExtensions:
  vite-plus@1.1.0:
    dependencies:
      '@vitest/ui': 5.0.3
