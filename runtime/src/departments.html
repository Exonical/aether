<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departments · Aether</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 24px;color:#202830;background:#f7f8fa}a{color:#315eae}section{background:white;border:1px solid #ddd;border-radius:10px;padding:20px;margin:20px 0}input,select,button{font:inherit;padding:8px;margin:4px}button{cursor:pointer}small{display:block;color:#526070}#status{white-space:pre-wrap}li{margin:8px 0}</style>
<a href="/">← Workspace</a><h1>Departments</h1><p>Department membership is separate from your private workspace. Sharing remains an explicit workspace action.</p><p id="status" role="status">Loading…</p><main id="content"></main>
<script>
const status=document.querySelector('#status'),content=document.querySelector('#content');
const element=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;};
async function api(body){const token=localStorage.getItem('authToken');if(!token)throw Error('Sign in to Aether, then return to Departments.');const r=await fetch('/api/departments',{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function form(parent,fields,submit,label){const f=element('form');const controls={};for(const [name,placeholder] of Object.entries(fields)){const input=element('input');input.placeholder=placeholder;input.setAttribute('aria-label',placeholder);input.required=true;controls[name]=input;f.append(input);}const b=element('button',label);f.append(b);f.onsubmit=async event=>{event.preventDefault();b.disabled=true;try{draw(await api(submit(Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.value])))));status.textContent='Saved.';}catch(error){status.textContent=error.message;}finally{b.disabled=false;}};parent.append(f);}
function draw(data){content.replaceChildren();status.textContent='Signed in as '+data.email;if(data.globalAdmin){const s=element('section');s.append(element('h2','Create department'));form(s,{department:'Department ID (e.g. engineering)',name:'Display name'},v=>({action:'create',...v}),'Create');content.append(s);}
for(const dept of data.departments){const s=element('section');s.append(element('h2',dept.name),element('small',dept.id+(dept.canManage?' · Administrator':'')));if(dept.canManage){const list=element('ul');for(const member of dept.members){const li=element('li',member.email+' · '+member.role+' · '+member.source);if(member.source==='manual'){const b=element('button','Remove');b.onclick=async()=>{try{draw(await api({action:'removeMember',department:dept.id,email:member.email}));}catch(error){status.textContent=error.message;}};li.append(b);}list.append(li);}s.append(list);form(s,{email:'Member email'},v=>({action:'setMember',department:dept.id,email:v.email,role:'member'}),'Add member');if(data.globalAdmin){form(s,{email:'Department administrator email'},v=>({action:'setMember',department:dept.id,email:v.email,role:'admin'}),'Appoint administrator');form(s,{name:'New department name'},v=>({action:'rename',department:dept.id,...v}),'Rename');}}else s.append(element('p','You are a member of this department.'));content.append(s);}if(!data.departments.length)content.append(element('p','No department memberships yet. Contact an administrator.'));}
api().then(draw).catch(error=>status.textContent=error.message);
</script></html>
